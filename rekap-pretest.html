<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pretest OSN & OMBN IPS 2027</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { biru: '#0EA5E9', biruTua: '#0284C7', langit: '#38BDF8', ungu: '#8B5CF6', hijau: '#22C55E' }
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    boxShadow: {
                        lembut: '0 10px 30px -12px rgba(14, 165, 233, 0.35)',
                        kartu: '0 4px 20px -8px rgba(15, 23, 42, 0.12)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #E4F4FF 0%, #F2FAFF 40%, #FFFFFF 100%);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #BAE6FD; border-radius: 10px; }
        .gradien-biru { background-image: linear-gradient(135deg, #38BDF8 0%, #0EA5E9 55%, #0284C7 100%); }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">
    <div id="app"></div>

    <script>
        const SUPABASE_URL = 'https://lhfjydoqphlypsgglklh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Pf4G_sAlH9HBz32NO4Y-7w_8y1yKJfI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const RANAH = ['Sejarah', 'Ekonomi', 'Geografi', 'Sosiologi', 'ASEAN dan Kewarganegaraan'];
        const MAKS_RANAH = { 'Sejarah': 36, 'Ekonomi': 12, 'Geografi': 20, 'Sosiologi': 20, 'ASEAN dan Kewarganegaraan': 12 };

        let st = {
            masuk: false,
            memuat: false,
            pesanLogin: '',
            hasil: [],
            soal: [],
            soalMap: {},
            cari: '',
            filterKelas: '',
            urut: 'nilai',
            aktif: null
        };

        function esc(s) {
            return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatWaktu(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return isNaN(d) ? iso : d.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function predikat(skor) {
            if (skor >= 85) return { teks: 'Sangat baik', cls: 'bg-emerald-50 text-emerald-600' };
            if (skor >= 70) return { teks: 'Baik', cls: 'bg-sky-50 text-brand-biruTua' };
            if (skor >= 55) return { teks: 'Cukup', cls: 'bg-amber-50 text-amber-600' };
            return { teks: 'Perlu bimbingan', cls: 'bg-rose-50 text-rose-500' };
        }

        function ranahDari(kategori) {
            if (!kategori) return null;
            const bagian = String(kategori).split(' - ');
            return bagian.length > 1 ? bagian[bagian.length - 1] : null;
        }

        function hitungRanah(h) {
            const hasil = {};
            RANAH.forEach(r => { hasil[r] = 0; });
            const detail = h.detail || {};
            st.soal.forEach(s => {
                const d = detail[s.id];
                if (d && d.benar) {
                    const r = ranahDari(s.kategori);
                    if (r && hasil[r] !== undefined) hasil[r] += Number(s.poin) || 4;
                }
            });
            return hasil;
        }

        async function login(email, pw) {
            st.memuat = true; st.pesanLogin = ''; render();
            const { error } = await db.auth.signInWithPassword({ email, password: pw });
            st.memuat = false;
            if (error) { st.pesanLogin = 'Email atau kata sandi salah.'; render(); return; }
            await muat();
        }

        async function muat() {
            st.memuat = true; render();
            const [hasilRes, soalRes] = await Promise.all([
                db.from('pretest_hasil').select('*').order('created_at', { ascending: false }),
                db.from('bank_soal').select('id, pertanyaan, kategori, poin, kunci, created_at').like('kategori', 'Pretest 2027%').order('created_at')
            ]);
            st.memuat = false;

            if (hasilRes.error || soalRes.error) {
                st.pesanLogin = 'Gagal memuat: ' + (hasilRes.error || soalRes.error).message;
                st.masuk = false;
                await db.auth.signOut();
                render();
                return;
            }

            st.hasil = hasilRes.data;
            st.soal = soalRes.data;
            st.soalMap = {};
            soalRes.data.forEach(s => { st.soalMap[s.id] = s; });
            st.masuk = true;
            render();
        }

        async function keluar() {
            await db.auth.signOut();
            st = { ...st, masuk: false, hasil: [], soal: [], soalMap: {}, aktif: null };
            render();
        }

        function render() {
            document.getElementById('app').innerHTML = st.masuk ? renderDashboard() : renderLogin();
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-kartu border border-sky-100 p-8 w-full max-w-sm space-y-5">
                        <div class="text-center space-y-2">
                            <div class="w-14 h-14 mx-auto rounded-2xl bg-sky-50 text-brand-biruTua flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-chart-simple"></i>
                            </div>
                            <h1 class="text-lg font-bold text-slate-900">Rekap Pretest 2027</h1>
                            <p class="text-xs text-slate-500">Masuk dengan akun guru</p>
                        </div>
                        <form onsubmit="event.preventDefault(); login(this.email.value.trim(), this.pw.value);" class="space-y-3">
                            <input name="email" type="email" required placeholder="Email" class="w-full p-3 bg-sky-50/60 border border-sky-100 focus:border-brand-langit focus:bg-white rounded-2xl text-sm outline-none transition">
                            <input name="pw" type="password" required placeholder="Kata sandi" class="w-full p-3 bg-sky-50/60 border border-sky-100 focus:border-brand-langit focus:bg-white rounded-2xl text-sm outline-none transition">
                            ${st.pesanLogin ? `<p class="text-xs text-rose-500">${esc(st.pesanLogin)}</p>` : ''}
                            <button type="submit" class="w-full py-3 gradien-biru text-white font-semibold rounded-2xl shadow-lembut text-sm">
                                ${st.memuat ? 'Memuat...' : 'Masuk'}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function daftarTampil() {
            let list = st.hasil.filter(h =>
                (!st.filterKelas || h.kelas === st.filterKelas) &&
                (!st.cari || h.nama.toLowerCase().includes(st.cari.toLowerCase()))
            );
            if (st.urut === 'nilai') list = list.slice().sort((a, b) => b.skor - a.skor || new Date(a.created_at) - new Date(b.created_at));
            else if (st.urut === 'nama') list = list.slice().sort((a, b) => a.nama.localeCompare(b.nama));
            else list = list.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            return list;
        }

        function renderDashboard() {
            const semua = st.hasil;
            const rata = semua.length ? (semua.reduce((a, h) => a + Number(h.skor), 0) / semua.length).toFixed(1) : '-';
            const tertinggi = semua.length ? Math.max(...semua.map(h => Number(h.skor))) : '-';
            const terendah = semua.length ? Math.min(...semua.map(h => Number(h.skor))) : '-';
            const kelasList = [...new Set(semua.map(h => h.kelas))].sort();
            const list = daftarTampil();

            // rata-rata per ranah
            const rataRanah = {};
            RANAH.forEach(r => {
                if (!semua.length) { rataRanah[r] = '-'; return; }
                const total = semua.reduce((a, h) => a + (hitungRanah(h)[r] || 0), 0);
                rataRanah[r] = (total / semua.length).toFixed(1);
            });

            return `
                <div class="gradien-biru text-white px-4 sm:px-6 py-4 shadow-lembut">
                    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2 min-w-0">
                            <i class="fa-solid fa-chart-simple text-sky-100"></i>
                            <h1 class="text-xs sm:text-sm font-semibold truncate">Rekap Pretest OSN &amp; OMBN IPS 2027</h1>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="eksporCSV()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-[11px] font-semibold">
                                <i class="fa-solid fa-file-csv"></i> Ekspor
                            </button>
                            <button onclick="cetak()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-[11px] font-semibold hidden sm:inline-flex">
                                <i class="fa-solid fa-print"></i>
                            </button>
                            <button onclick="muat()" class="bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl text-[11px] font-semibold">
                                <i class="fa-solid fa-rotate"></i>
                            </button>
                            <button onclick="keluar()" class="bg-white text-brand-biruTua hover:bg-sky-50 px-3 py-1.5 rounded-xl text-[11px] font-bold">
                                Keluar
                            </button>
                        </div>
                    </div>
                </div>

                <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        ${kartuStat('Peserta', semua.length, 'fa-users', 'text-brand-biruTua')}
                        ${kartuStat('Rata-rata', rata, 'fa-chart-line', 'text-brand-ungu')}
                        ${kartuStat('Tertinggi', tertinggi, 'fa-arrow-up', 'text-emerald-500')}
                        ${kartuStat('Terendah', terendah, 'fa-arrow-down', 'text-rose-400')}
                    </div>

                    <div class="bg-white rounded-3xl border border-sky-100 shadow-kartu p-4">
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input type="text" value="${esc(st.cari)}" oninput="setCari(this.value)" placeholder="Cari nama..." class="flex-1 px-4 py-2.5 bg-sky-50/60 border border-sky-100 rounded-2xl text-sm outline-none focus:border-brand-langit focus:bg-white transition">
                            <select onchange="setFilter('filterKelas', this.value)" class="px-4 py-2.5 bg-sky-50/60 border border-sky-100 rounded-2xl text-sm outline-none">
                                <option value="">Semua kelas</option>
                                ${kelasList.map(k => `<option value="${esc(k)}" ${st.filterKelas === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}
                            </select>
                            <select onchange="setFilter('urut', this.value)" class="px-4 py-2.5 bg-sky-50/60 border border-sky-100 rounded-2xl text-sm outline-none">
                                <option value="nilai" ${st.urut === 'nilai' ? 'selected' : ''}>Nilai tertinggi</option>
                                <option value="nama" ${st.urut === 'nama' ? 'selected' : ''}>Nama A-Z</option>
                                <option value="waktu" ${st.urut === 'waktu' ? 'selected' : ''}>Terbaru</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl border border-sky-100 shadow-kartu overflow-hidden">
                        <div class="px-5 py-4 border-b border-sky-50 flex items-center justify-between">
                            <h2 class="text-sm font-bold text-slate-900">Tabel Nilai</h2>
                            <span class="text-[11px] text-slate-400">${list.length} baris</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr class="bg-sky-50/60 text-[10px] uppercase tracking-wider text-slate-500">
                                        <th class="p-3 text-left w-12">#</th>
                                        <th class="p-3 text-left">Nama</th>
                                        <th class="p-3 text-left w-36">Kelas</th>
                                        <th class="p-3 text-center">Benar</th>
                                        <th class="p-3 text-center">Salah</th>
                                        <th class="p-3 text-center">Kosong</th>
                                        <th class="p-3 text-center">Nilai</th>
                                        <th class="p-3 text-left">Predikat</th>
                                        <th class="p-3 text-left w-32">Waktu</th>
                                        <th class="p-3 text-center w-16"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${list.length ? list.map((h, i) => {
                                        const p = predikat(Number(h.skor));
                                        return `
                                            <tr class="border-t border-sky-50 hover:bg-sky-50/40">
                                                <td class="p-3 text-slate-400">${i + 1}</td>
                                                <td class="p-3 font-medium text-slate-800">${esc(h.nama)}</td>
                                                <td class="p-3 text-slate-500 text-xs">${esc(h.kelas)}</td>
                                                <td class="p-3 text-center text-emerald-600 font-semibold">${h.benar}</td>
                                                <td class="p-3 text-center text-rose-500">${h.salah}</td>
                                                <td class="p-3 text-center text-slate-400">${h.kosong}</td>
                                                <td class="p-3 text-center font-extrabold text-brand-biruTua">${h.skor}</td>
                                                <td class="p-3"><span class="text-[10px] font-semibold px-2 py-1 rounded-lg ${p.cls}">${p.teks}</span></td>
                                                <td class="p-3 text-[11px] text-slate-400">${formatWaktu(h.created_at)}</td>
                                                <td class="p-3 text-center">
                                                    <button onclick="lihat('${h.id}')" class="p-1.5 text-slate-400 hover:text-brand-biru"><i class="fa-solid fa-eye"></i></button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('') : `<tr><td colspan="10" class="p-8 text-center text-xs text-slate-400">Belum ada hasil pretest.</td></tr>`}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl border border-sky-100 shadow-kartu p-5">
                        <h2 class="text-sm font-bold text-slate-900 mb-1">Rata-rata per Ranah</h2>
                        <p class="text-[11px] text-slate-400 mb-4">Skor maksimal tiap ranah sesuai rubrik</p>
                        <div class="space-y-3">
                            ${RANAH.map(r => {
                                const maks = MAKS_RANAH[r];
                                const nilai = rataRanah[r] === '-' ? 0 : Number(rataRanah[r]);
                                const persen = Math.round((nilai / maks) * 100) || 0;
                                return `
                                    <div>
                                        <div class="flex items-center justify-between text-[11px] mb-1">
                                            <span class="font-medium text-slate-600">${r}</span>
                                            <span class="text-slate-400">${rataRanah[r]} / ${maks}</span>
                                        </div>
                                        <div class="h-2 bg-sky-50 rounded-full overflow-hidden">
                                            <div class="h-full gradien-biru rounded-full" style="width:${persen}%"></div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>

                ${renderModal()}
            `;
        }

        function kartuStat(label, nilai, ikon, warna) {
            return `
                <div class="bg-white rounded-2xl p-4 border border-sky-100 shadow-kartu">
                    <div class="flex items-center gap-2 mb-1">
                        <i class="fa-solid ${ikon} text-[11px] ${warna}"></i>
                        <span class="text-[10px] font-medium text-slate-500">${label}</span>
                    </div>
                    <span class="block text-2xl font-extrabold text-slate-900">${nilai}</span>
                </div>
            `;
        }

        function renderModal() {
            const h = st.hasil.find(x => x.id === st.aktif);
            if (!h) return '';

            const detail = h.detail || {};
            const ranah = hitungRanah(h);
            const p = predikat(Number(h.skor));

            return `
                <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this) tutup()">
                    <div class="bg-white rounded-3xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                        <div class="gradien-biru text-white px-6 py-4 flex items-start justify-between">
                            <div>
                                <h3 class="font-bold text-base">${esc(h.nama)}</h3>
                                <p class="text-[11px] text-sky-50/90">${esc(h.kelas)} · ${formatWaktu(h.created_at)}</p>
                            </div>
                            <button onclick="tutup()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div class="p-5 overflow-y-auto custom-scrollbar space-y-4">
                            <div class="grid grid-cols-4 gap-2 text-center">
                                <div class="bg-sky-50 rounded-xl p-3"><span class="block text-lg font-bold text-brand-biruTua">${h.skor}</span><span class="text-[10px] text-slate-500">Nilai</span></div>
                                <div class="bg-emerald-50 rounded-xl p-3"><span class="block text-lg font-bold text-emerald-600">${h.benar}</span><span class="text-[10px] text-slate-500">Benar</span></div>
                                <div class="bg-rose-50 rounded-xl p-3"><span class="block text-lg font-bold text-rose-500">${h.salah}</span><span class="text-[10px] text-slate-500">Salah</span></div>
                                <div class="bg-slate-50 rounded-xl p-3"><span class="block text-lg font-bold text-slate-400">${h.kosong}</span><span class="text-[10px] text-slate-500">Kosong</span></div>
                            </div>

                            <div class="flex flex-wrap gap-2">
                                ${RANAH.map(r => `<span class="text-[10px] font-semibold px-2.5 py-1 rounded-lg bg-sky-50 text-brand-biruTua">${r}: ${ranah[r]}/${MAKS_RANAH[r]}</span>`).join('')}
                            </div>

                            <div>
                                <h4 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">Rincian Jawaban</h4>
                                <div class="border border-sky-100 rounded-2xl overflow-hidden">
                                    <table class="w-full text-xs">
                                        <thead>
                                            <tr class="bg-sky-50/60 text-[10px] uppercase text-slate-500">
                                                <th class="p-2 text-left w-8">No</th>
                                                <th class="p-2 text-left">Soal</th>
                                                <th class="p-2 text-center w-16">Jawab</th>
                                                <th class="p-2 text-center w-14">Kunci</th>
                                                <th class="p-2 text-center w-16">Hasil</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${st.soal.map((s, i) => {
                                                const d = detail[s.id] || {};
                                                const kosong = !d.jawaban;
                                                return `
                                                    <tr class="border-t border-sky-50">
                                                        <td class="p-2 text-slate-400">${i + 1}</td>
                                                        <td class="p-2 text-slate-700">${esc(s.pertanyaan).slice(0, 90)}${s.pertanyaan.length > 90 ? '…' : ''}</td>
                                                        <td class="p-2 text-center font-semibold uppercase">${kosong ? '-' : esc(d.jawaban)}</td>
                                                        <td class="p-2 text-center uppercase text-slate-400">${esc(s.kunci)}</td>
                                                        <td class="p-2 text-center">
                                                            ${kosong ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">KOSONG</span>'
                                                                : d.benar ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">BENAR</span>'
                                                                : '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-rose-100 text-rose-600">SALAH</span>'}
                                                        </td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setCari(v) {
            st.cari = v;
            const pos = document.activeElement && document.activeElement.selectionStart;
            render();
            const el = document.querySelector('input[placeholder="Cari nama..."]');
            if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        }

        function setFilter(k, v) { st[k] = v; render(); }
        function lihat(id) { st.aktif = id; render(); }
        function tutup() { st.aktif = null; render(); }
        function cetak() { window.print(); }

        function eksporCSV() {
            const list = daftarTampil();
            if (!list.length) { alert('Belum ada data untuk diekspor.'); return; }

            const kepala = ['No', 'Nama', 'Kelas', 'Nilai', 'Predikat', 'Benar', 'Salah', 'Kosong',
                ...RANAH.map(r => `Skor ${r} (maks ${MAKS_RANAH[r]})`), 'Waktu'];

            const baris = list.map((h, i) => {
                const p = predikat(Number(h.skor));
                const rn = hitungRanah(h);
                return [i + 1, h.nama, h.kelas, h.skor, p.teks, h.benar, h.salah, h.kosong,
                    ...RANAH.map(r => rn[r]), formatWaktu(h.created_at)];
            });

            const csv = [kepala, ...baris]
                .map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
                .join('\r\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rekap-pretest-osn-2027-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        (async function init() {
            const { data } = await db.auth.getSession();
            if (data.session) await muat();
            else render();
        })();
    </script>
</body>
</html>
